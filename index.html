<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a0608; --surface:#2a0d11; --surface-2:#380f15;
    --line:#4a1a22; --text:#f6ebe9; --muted:#b58a8f;
    --accent:#e01e37; --accent-2:#9b1322; --accent-ink:#fff5f5;
    --gold:#d8a24a;
    --radius:14px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom));
    background-image:radial-gradient(120% 60% at 50% -10%, #3a0e14 0%, transparent 60%)}
  img{max-width:100%;display:block}
  .blackfont{font-family:"Archivo Black",sans-serif}

  header{padding:20px 16px 8px;display:flex;align-items:center;justify-content:space-between}
  header .logo{display:flex;align-items:center;gap:9px}
  header h1{font-family:"Archivo Black",sans-serif;font-size:23px;letter-spacing:.02em;
    background:linear-gradient(180deg,#fff 0%,#f0b9bd 120%);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  header .star{color:var(--accent);font-size:20px}
  header .loc{font-size:10px;color:var(--muted);letter-spacing:.2em;border:1px solid var(--line);
    padding:5px 9px;border-radius:999px}

  .ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);background:var(--accent-2);margin:10px 0 16px}
  .ticker div{display:inline-block;padding:7px 0;animation:scroll 18s linear infinite;
    font-size:11px;font-weight:700;letter-spacing:.18em;color:#ffdede}
  .ticker span{margin:0 18px}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.ticker div{animation:none;padding-left:16px}}

  .filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 16px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
    transition:.15s;white-space:nowrap}
  .chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
    box-shadow:0 4px 14px rgba(224,30,55,.35)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.18s}
  .card:active{transform:scale(.98)}
  .card .ph{aspect-ratio:3/4;background:
    repeating-linear-gradient(45deg,#3a1217 0 10px,#320f14 10px 20px);
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .card .ph::after{content:"";position:absolute;inset:0;
    background:radial-gradient(70% 50% at 50% 40%, rgba(224,30,55,.22), transparent 70%)}
  .card .ph b{font-family:"Archivo Black",sans-serif;font-size:26px;color:#5a2027;
    letter-spacing:.04em;position:relative;z-index:1;text-align:center;line-height:1}
  .tag{position:absolute;top:8px;left:8px;z-index:2;background:var(--accent);color:var(--accent-ink);
    font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.06em}
  .tag.gold{background:var(--gold);color:#2a0d11}
  .card .body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:3px;flex:1}
  .card .brand{font-size:10px;color:var(--accent);letter-spacing:.12em;font-weight:700}
  .card .name{font-size:13px;line-height:1.3;font-weight:500}
  .card .price{margin-top:auto;padding-top:7px;font-size:16px;font-weight:700;letter-spacing:.01em}

  .sheet{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateY(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;
    background-image:radial-gradient(120% 50% at 50% -5%, #3a0e14 0%, transparent 55%);
    padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .sheet.open{transform:translateY(0)}
  .sheet-head{position:sticky;top:0;background:rgba(26,6,8,.92);backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid var(--line);z-index:2}
  .back{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;flex:0 0 auto}
  .sheet-head .title{font-size:14px;font-weight:600;letter-spacing:.02em}

  .hero{aspect-ratio:3/4;position:relative;overflow:hidden;
    background:repeating-linear-gradient(45deg,#3a1217 0 14px,#320f14 14px 28px);
    display:flex;align-items:center;justify-content:center}
  .hero::after{content:"";position:absolute;inset:0;
    background:radial-gradient(60% 45% at 50% 42%, rgba(224,30,55,.25), transparent 70%)}
  .hero b{font-family:"Archivo Black",sans-serif;font-size:46px;color:#5a2027;
    letter-spacing:.04em;position:relative;z-index:1;text-align:center;line-height:1;padding:0 20px}
  .detail{padding:20px 16px}
  .detail .brand{font-size:11px;color:var(--accent);letter-spacing:.16em;margin-bottom:6px;font-weight:700}
  .detail .name{font-family:"Archivo Black",sans-serif;font-size:22px;line-height:1.15}
  .detail .price{font-size:25px;font-weight:700;margin:16px 0}
  .detail .desc{color:var(--muted);font-size:14px;line-height:1.65}
  .section-label{font-size:11px;color:var(--muted);letter-spacing:.14em;margin:24px 0 10px;font-weight:600}
  .sizes{display:flex;flex-wrap:wrap;gap:8px}
  .size{border:1px solid var(--line);background:var(--surface);color:var(--text);
    min-width:54px;padding:12px 0;text-align:center;border-radius:10px;font-size:14px;
    font-weight:600;cursor:pointer;transition:.15s}
  .size.active{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);
    box-shadow:0 4px 14px rgba(224,30,55,.35)}
  .size.off{opacity:.3;text-decoration:line-through;cursor:not-allowed}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:50;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 72%,transparent);
    display:flex;gap:10px;align-items:center}
  .btn{flex:1;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);transition:.15s;letter-spacing:.02em}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}

  .cart-count{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#2a0d11;
    font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;padding:0 5px}
  .cart-fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;
    width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    border:none;font-size:23px;cursor:pointer;box-shadow:0 8px 24px rgba(224,30,55,.45)}

  .cart-item{display:flex;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);align-items:center}
  .cart-item .mini{width:52px;height:68px;border-radius:8px;flex:0 0 auto;
    background:repeating-linear-gradient(45deg,#3a1217 0 8px,#320f14 8px 16px);
    display:flex;align-items:center;justify-content:center;
    font-family:"Archivo Black",sans-serif;font-size:11px;color:#5a2027}
  .cart-item .info{flex:1;min-width:0}
  .cart-item .info .n{font-size:14px;font-weight:500}
  .cart-item .info .s{font-size:12px;color:var(--muted);margin-top:2px}
  .cart-item .info .p{font-size:14px;font-weight:700;margin-top:4px}
  .rm{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
  .empty{text-align:center;color:var(--muted);padding:70px 24px;font-size:15px;line-height:1.7}
  .empty b{font-family:"Archivo Black",sans-serif;color:var(--text);font-size:17px;display:block;margin-bottom:6px}
  .total-row{display:flex;justify-content:space-between;align-items:center;padding:20px 16px;
    font-size:18px;font-weight:700}
  .total-row .lbl{font-size:12px;color:var(--muted);letter-spacing:.1em;font-weight:600}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="star">✦</span><h1>ARCHIVE</h1></div>
  <span class="loc">MOSCOW</span>
</header>

<div class="ticker"><div id="tickerText"></div></div>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<button class="cart-fab" id="cartFab" onclick="openCart()">🛒
  <span class="cart-count" id="fabCount" style="display:none">0</span>
</button>

<div class="sheet" id="productSheet">
  <div class="sheet-head">
    <button class="back" onclick="closeProduct()">‹</button>
    <div class="title">В каталог</div>
  </div>
  <div id="productBody"></div>
  <div class="bar">
    <button class="btn" id="addBtn" onclick="addCurrent()">Выберите размер</button>
  </div>
</div>

<div class="sheet" id="cartSheet">
  <div class="sheet-head">
    <button class="back" onclick="closeCart()">‹</button>
    <div class="title">Корзина</div>
  </div>
  <div id="cartBody"></div>
  <div class="bar" id="cartBar" style="display:none">
    <button class="btn" onclick="checkout()">Оформить заказ</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }

const PRODUCTS = [
  {id:1, brand:"STONE ISLAND", name:"Пуховик Garment Dyed Crinkle Reps", price:42000, cat:"Пуховики", sizes:["S","M","L","XL"], off:["S"], tag:"NEW",
   desc:"Куртка на пуху, фирменная нашивка на рукаве. Состояние хорошее, без дефектов. Оригинал."},
  {id:2, brand:"C.P. COMPANY", name:"Пуховик D.D. Shell Goggle", price:55000, cat:"Пуховики", sizes:["M","L","XL"], off:[], tag:"TOP", gold:true,
   desc:"Легендарная линейка D.D. Shell, капюшон с линзами-гогглами. Оригинал, отличное состояние."},
  {id:3, brand:"STONE ISLAND", name:"Худи Cotton Fleece Logo", price:16000, cat:"Худи", sizes:["S","M","L","XL"], off:[],
   desc:"Плотный хлопковый флис, нашивка-компас. Практически новое."},
  {id:4, brand:"C.P. COMPANY", name:"Зип-худи Diagonal Raised Fleece", price:19500, cat:"Зип-худи", sizes:["M","L","XL"], off:["XL"],
   desc:"Молния во всю длину, фирменные линзы на капюшоне. Состояние хорошее."},
  {id:5, brand:"STONE ISLAND", name:"Зип-худи Full Zip Compass", price:21000, cat:"Зип-худи", sizes:["S","M","L"], off:[], tag:"NEW",
   desc:"Тёплый зип с высоким воротником. Оригинал."},
  {id:6, brand:"C.P. COMPANY", name:"Худи Brushed Emerized Diagonal", price:17500, cat:"Худи", sizes:["S","M","L","XL"], off:[],
   desc:"Мягкий диагональный флис. Отличное состояние."},
];

const CATS = ["Все","Пуховики","Худи","Зип-худи"];
let activeCat = "Все";
let cart = [];
let current = null;
let currentSize = null;

const rub = n => n.toLocaleString("ru-RU") + " ₽";
const $ = id => document.getElementById(id);

// бегущая строка
const marquee = "НОВЫЙ ДРОП КАЖДУЮ НЕДЕЛЮ ✦ ТОЛЬКО ОРИГИНАЛ ✦ ДОСТАВКА ПО РФ ✦ ";
$("tickerText").innerHTML = `<span>${marquee.repeat(4)}</span>`;

function renderFilters(){
  $("filters").innerHTML = CATS.map(c =>
    `<button class="chip ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){ activeCat=c; renderFilters(); renderGrid(); }

function phLabel(p){ return p.brand.replace("C.P. COMPANY","C.P.").replace("STONE ISLAND","STONE"); }

function renderGrid(){
  const list = PRODUCTS.filter(p => activeCat==="Все" || p.cat===activeCat);
  $("grid").innerHTML = list.map(p => `
    <div class="card" onclick="openProduct(${p.id})">
      <div class="ph"><b>${phLabel(p)}</b>
        ${p.tag?`<span class="tag ${p.gold?'gold':''}">${p.tag}</span>`:""}</div>
      <div class="body">
        <div class="brand">${p.brand}</div>
        <div class="name">${p.name}</div>
        <div class="price">${rub(p.price)}</div>
      </div>
    </div>`).join("");
}

function openProduct(id){
  current = PRODUCTS.find(p=>p.id===id);
  currentSize = null;
  $("productBody").innerHTML = `
    <div class="hero"><b>${phLabel(current)}</b></div>
    <div class="detail">
      <div class="brand">${current.brand}</div>
      <div class="name">${current.name}</div>
      <div class="price">${rub(current.price)}</div>
      <div class="desc">${current.desc}</div>
      <div class="section-label">РАЗМЕР</div>
      <div class="sizes">
        ${current.sizes.map(s => {
          const off = current.off.includes(s);
          return `<div class="size ${off?'off':''}" ${off?'':`onclick="pickSize('${s}',this)"`}>${s}</div>`;
        }).join("")}
      </div>
    </div>`;
  updateAddBtn();
  $("productSheet").classList.add("open");
}
function closeProduct(){ $("productSheet").classList.remove("open"); }

function pickSize(s, el){
  currentSize = s;
  document.querySelectorAll("#productBody .size").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  if(tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
  updateAddBtn();
}
function updateAddBtn(){
  const b = $("addBtn");
  if(currentSize){ b.textContent = `В корзину · ${rub(current.price)}`; b.disabled=false; }
  else { b.textContent = "Выберите размер"; b.disabled=true; }
}
function addCurrent(){
  cart.push({key:Date.now(), id:current.id, size:currentSize});
  if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  updateCartCount();
  closeProduct();
}

function updateCartCount(){
  const n = cart.length;
  const el = $("fabCount");
  el.textContent = n;
  el.style.display = n ? "flex" : "none";
}
function openCart(){
  const bar = $("cartBar");
  if(cart.length===0){
    $("cartBody").innerHTML = `<div class="empty"><b>Пока пусто</b>Загляни в каталог и собери образ.</div>`;
    bar.style.display="none";
  } else {
    const rows = cart.map(item=>{
      const p = PRODUCTS.find(x=>x.id===item.id);
      return `<div class="cart-item">
        <div class="mini">${phLabel(p)}</div>
        <div class="info">
          <div class="n">${p.name}</div>
          <div class="s">${p.brand} · Размер ${item.size}</div>
          <div class="p">${rub(p.price)}</div>
        </div>
        <button class="rm" onclick="removeItem(${item.key})">✕</button>
      </div>`;
    }).join("");
    const total = cart.reduce((s,i)=>s+PRODUCTS.find(x=>x.id===i.id).price,0);
    $("cartBody").innerHTML = rows +
      `<div class="total-row"><span class="lbl">ИТОГО</span><span>${rub(total)}</span></div>`;
    bar.style.display="flex";
  }
  $("cartSheet").classList.add("open");
}
function closeCart(){ $("cartSheet").classList.remove("open"); }
function removeItem(key){ cart = cart.filter(i=>i.key!==key); updateCartCount(); openCart(); }

// Имя бота без @ — ОБЯЗАТЕЛЬНО укажи своего (например FinderstoneBot)
const BOT_USERNAME = "FinderstoneBot";

function checkout(){
  if(cart.length===0) return;

  // Кодируем заказ в компактную строку: id-размер через точку с запятой.
  // Пример: "1-M;3-L" — товар 1 размер M, товар 3 размер L.
  const code = cart.map(i => `${i.id}-${i.size}`).join(";");

  // Telegram umеет открыть чат с ботом и подставить текст после /start
  // через параметр startapp/start. Мы передаём код заказа боту.
  const payload = "order_" + btoa(unescape(encodeURIComponent(code)))
                    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

  const link = `https://t.me/${BOT_USERNAME}?start=${payload}`;

  if(tg && typeof tg.openTelegramLink === "function"){
    tg.openTelegramLink(link);   // откроет чат с ботом внутри Telegram
    if(tg.close) setTimeout(()=>tg.close(), 300);
  } else {
    // вне Telegram (в браузере) — просто открываем ссылку
    window.open(link, "_blank");
  }
}

renderFilters();
renderGrid();
updateCartCount();
</script>
</body>
</html>
